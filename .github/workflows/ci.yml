name: CI
on:
  push:
  pull_request:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dataforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dataforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate SQL pipeline
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d dataforge -v ON_ERROR_STOP=1 -f schema.sql
          psql -h 127.0.0.1 -U postgres -d dataforge -v ON_ERROR_STOP=1 -f seed.sql
          psql -h 127.0.0.1 -U postgres -d dataforge -v ON_ERROR_STOP=1 -f analytics.sql
